<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5e7e">
  <title>FieldPack Trip Planner</title>
  <meta name="description" content="Plan field trips from your Excel gear inventory with AI analysis.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎒</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=202611012221">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 46" class="logo" aria-hidden="true">
        <circle cx="46" cy="14" r="9" fill="#f2b632"/>
        <path d="M4 34 C10 22 18 14 28 14 C36 14 40 22 44 26 L50 34 Z" fill="#a8724a"/>
        <path d="M6 31 C12 21 19 16 28 16 C35 16 39 22 42 25" fill="none" stroke="#9bb37a" stroke-width="3" stroke-linecap="round"/>
        <path d="M44 34 L46 24 C48 20 56 20 58 24 L60 34 L56 34 L55 29 C54 26 50 26 49 29 L48 34 Z" fill="#a8724a"/>
        <path d="M0 36 q4 -3 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 L64 46 L0 46 Z" fill="#8fd5c9"/>
        <path d="M0 40 q4 -3 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0" fill="none" stroke="#fff" stroke-width="1.5" opacity=".8"/>
      </svg>
      <div><b>FieldPack</b><small>Archaeology trip planner</small></div>
    </div>
    <nav class="tabs" aria-label="Main">
      <button data-view="planner">🗺️ <span>Quick Plan</span></button>
      <button data-view="board">🎒 <span>Pack Board</span></button>
      <button data-view="inventory">🧾 <span>Inventory</span></button>
      <button data-view="history">📜 <span>History</span></button>
      <button data-view="settings">⚙️ <span>Settings</span></button>
    </nav>
    <div class="wb">
      <span id="wbStatus" class="pill"></span>
      <button id="btnOpen" class="btn small" title="Open an Excel workbook">📂 Open</button>
      <button id="btnNew" class="btn small" title="Create a new workbook">✨ New</button>
      <button id="btnSave" class="btn small primary" title="Save to workbook (Ctrl+S)">💾 Save</button>
    </div>
  </header>
  <main id="view"></main>
  <footer class="site-foot"><span>🏺 Context is everything</span><span>📋 Carry your permits</span><span>🌊 Check the marine forecast</span><span>🦊 Pack it in, pack it out</span></footer>
  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    // Safety net: if the app can't start (e.g. a half-updated cache or bad saved data),
    // show a recovery panel instead of a blank page.
    window.__fieldpackFail = function (msg) {
      var v = document.getElementById('view');
      if (!v || v.dataset.failed) return;
      v.dataset.failed = '1';
      v.innerHTML = '<section class="card" style="max-width:640px;margin:2rem auto;text-align:center">' +
        '<h2>Hmm, FieldPack didn\u2019t start</h2>' +
        '<p>This usually happens right after an update while your browser still has some old files, or when data saved by an older version gets in the way.</p>' +
        '<p><button class="btn primary" onclick="location.reload(true)">\u21bb Reload</button> ' +
        '<button class="btn danger" onclick="if(confirm(\'Clear FieldPack data stored in this browser? Your Excel files are not touched, but unsaved trips/gear that only live in this browser will be removed.\')){localStorage.clear();sessionStorage.clear();location.reload(true)}">Reset browser data</button></p>' +
        '<p class="muted small">Details: ' + String(msg).replace(/[<>&]/g, '') + '</p></section>';
    };
    window.addEventListener('error', function (e) { if (!window.__fieldpackStarted) window.__fieldpackFail(e.message || 'script failed to load'); }, true);
    window.addEventListener('unhandledrejection', function (e) { if (!window.__fieldpackStarted) window.__fieldpackFail(e.reason && e.reason.message || e.reason); });
    setTimeout(function () { if (!window.__fieldpackStarted) window.__fieldpackFail('The app did not finish loading within 15 seconds (check your internet connection).'); }, 15000);
  </script>
  <script type="module" src="js/app.js?v=202611012221"></script>
</body>
</html>
